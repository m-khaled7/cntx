syntax = "proto3";

package auth;

message RegisterRequest {
  string firstName       = 1;
  string lastName        = 2;
  string email           = 3;
  string password        = 4;
  string confirmPassword = 5;
}

message LoginRequest {
  string email    = 1;
  string password = 2;
}

message AuthResponse {
  string refreshToken = 1;
  string accessToken  = 2;
}

